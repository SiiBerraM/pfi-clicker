name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q PFI-clicker.zip -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug -p src
      - run: cp src/app/build/outputs/apk/debug/app-debug.apk PFI-clicker.apk
      - run: gh release create "v1.${{ github.run_number }}" PFI-clicker.apk --title "P.F.I clicker" --notes "Produced by Berratone"
        env:
          GH_TOKEN: ${{ github.token }}
